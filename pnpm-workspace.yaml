packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  msgpackr-extract: false
  protobufjs: false
  sharp: true
  unrs-resolver: true

catalogMode: strict

engineStrict: true

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - "@sports/*"

nodeVersion: 24.18.0

overrides:
  js-yaml: 4.3.0
  next: 16.2.11
  postcss: 8.5.22
  react: 19.2.8
  react-dom: 19.2.8
  sharp: 0.35.3

preferFrozenLockfile: true

saveExact: true

strictPeerDependencies: true

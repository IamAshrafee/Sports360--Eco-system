name: sports-management

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: sports_management
      POSTGRES_PASSWORD: sports_migrator_local
      POSTGRES_USER: sports_migrator
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --username sports_migrator --dbname sports_management",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    ports:
      - "127.0.0.1:55432:5432"
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql

  valkey:
    image: valkey/valkey:9.1.0-alpine
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    ports:
      - "127.0.0.1:56379:6379"
    restart: unless-stopped
    volumes:
      - valkey-data:/data

volumes:
  postgres-data:
  valkey-data:
